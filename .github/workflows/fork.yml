name: Fork Linux baseline

on:
  push:
    branches: ['**']
    tags: ['v*-ricky.*']
  pull_request:
    branches: [ricky-opencode2]

permissions:
  contents: read

concurrency:
  group: fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Ricky-Hao/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Pinned private build tools
        run: bash fork/setup-build-tools.sh "$RUNNER_TEMP/fork-tools"
      - name: Offline release guards
        env:
          TEST_TMP_ROOT: ${{ runner.temp }}
        run: python3 -B fork/test_release.py
      - name: Readiness tests, compile, package and version check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 -B fork/build.py --output "$RUNNER_TEMP/fork-build" \
            --node "$RUNNER_TEMP/fork-tools/node-v22.22.0-linux-x64/bin/node" \
            --bun "$RUNNER_TEMP/fork-tools/bun-linux-x64-baseline/bun" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-linux-baseline
          path: ${{ runner.temp }}/fork-build/assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'Ricky-Hao/opencode' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-ricky.')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fork-linux-baseline
          path: release-assets
      - name: Validate own tag and publish new release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B fork/publish.py release-assets
